<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Лёгкий старт — Кабинет</title>
  <style>
    :root {
      --bg: #0f1226; --card: #1a1f3a; --card2: #232a4d;
      --accent: #ffb547; --accent2: #ff6b6b; --text: #eef1ff;
      --muted: #9aa3cf; --good: #4ade80;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #0f1226, #171b38);
      color: var(--text); min-height: 100vh; padding: 16px;
    }
    .wrap { max-width: 480px; margin: 0 auto; }
    .loading { text-align: center; padding: 60px 0; color: var(--muted); }

    /* Шапка */
    .hero {
      background: linear-gradient(135deg, #ff6b6b, #ffb547);
      border-radius: 20px; padding: 22px; color: #2a1a00;
      box-shadow: 0 10px 30px rgba(255,107,107,.25);
    }
    .hero .hi { font-size: 14px; opacity: .8; }
    .hero .name { font-size: 26px; font-weight: 800; margin: 2px 0 6px; }
    .hero .role {
      display: inline-block; background: rgba(0,0,0,.15);
      padding: 3px 12px; border-radius: 20px; font-size: 13px; font-weight: 600;
    }
    .dragons {
      margin-top: 16px; display: flex; align-items: center; gap: 10px;
      background: rgba(0,0,0,.12); border-radius: 14px; padding: 12px 16px;
    }
    .dragons .num { font-size: 34px; font-weight: 800; line-height: 1; }
    .dragons .lbl { font-size: 13px; opacity: .85; }

    /* Карточки */
    .card {
      background: var(--card); border-radius: 16px; padding: 16px;
      margin-top: 14px; border: 1px solid rgba(255,255,255,.05);
    }
    .card h2 { font-size: 15px; color: var(--accent); margin-bottom: 12px; }
    .referrer { display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--card2); display: grid; place-items: center; font-size: 20px;
    }
    .referrer .rn { font-weight: 700; }
    .referrer .rr { font-size: 13px; color: var(--muted); }

    .row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .row:last-child { border-bottom: none; }
    .row .plus { color: var(--good); font-weight: 700; }

    .mission {
      display: flex; align-items: center; gap: 10px; padding: 9px 0;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .mission:last-child { border-bottom: none; }
    .check {
      width: 22px; height: 22px; border-radius: 50%; flex: none;
      display: grid; place-items: center; font-size: 13px;
      background: var(--card2); color: var(--muted);
    }
    .check.done { background: var(--good); color: #06340f; }
    .mission .mt { flex: 1; font-size: 14px; }
    .mission .mr { font-size: 12px; color: var(--accent); }
    .dayhdr { font-size: 12px; color: var(--muted); margin: 14px 0 4px; font-weight: 700; }
    .footnote { text-align:center; color: var(--muted); font-size: 12px; margin: 20px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="app" class="loading">Загружаю кабинет из базы данных…</div>
  </div>

  <script>
    async function load() {
      const app = document.getElementById("app");
      try {
        const r = await fetch("/api/cabinet");
        const d = await r.json();

        const done = new Set(d.completedMissionIds);

        const history = d.dragonHistory.map(t =>
          `<div class="row"><span>${t.reason}</span><span class="plus">+${t.amount} 🐉</span></div>`
        ).join("");

        const program = d.program.map(day => {
          if (!day.missions.length) return "";
          const items = day.missions.map(m => `
            <div class="mission">
              <span class="check ${done.has(m.id) ? "done" : ""}">${done.has(m.id) ? "✓" : ""}</span>
              <span class="mt">${m.title}</span>
              <span class="mr">+${m.reward}</span>
            </div>`).join("");
          return `<div class="dayhdr">${day.title}</div>${items}`;
        }).join("");

        app.className = "";
        app.innerHTML = `
          <div class="hero">
            <div class="hi">Добро пожаловать в «Лёгкий старт»</div>
            <div class="name">${d.me.name}</div>
            <span class="role">${d.me.role}</span>
            <div class="dragons">
              <span style="font-size:30px">🐉</span>
              <div>
                <div class="num">${d.me.dragons}</div>
                <div class="lbl">Драконов — твои баллы</div>
              </div>
            </div>
          </div>

          ${d.referrer ? `
          <div class="card">
            <h2>Кто тебя пригласил</h2>
            <div class="referrer">
              <div class="avatar">👤</div>
              <div>
                <div class="rn">${d.referrer.name}</div>
                <div class="rr">${d.referrer.role}</div>
              </div>
            </div>
          </div>` : ""}

          <div class="card">
            <h2>История Драконов</h2>
            ${history || '<div class="rr">Пока пусто</div>'}
          </div>

          <div class="card">
            <h2>Программа и миссии</h2>
            ${program}
          </div>

          <div class="footnote">Данные загружены из настоящей базы приложения ✨</div>
        `;
      } catch (e) {
        app.innerHTML = "Не удалось загрузить данные. Сервер запущен?";
      }
    }
    load();
  </script>
</body>
</html>
